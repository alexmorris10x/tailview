name: TailView
options:
  bundleIdPrefix: com.10x
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: 98CDQPW36W
targets:
  TailViewMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [MacHost, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.mac
        INFOPLIST_FILE: MacHost/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
  TailViewIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [IOSViewer, Shared, LiveControls, WidgetSupport]
    dependencies:
      - target: TailViewLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 63
        APP_DISPLAY_NAME: TailView
        TAILVIEW_URL_SCHEME: tailview
        INFOPLIST_FILE: IOSViewer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.ios.dev
          APP_DISPLAY_NAME: TailView Dev
          TAILVIEW_URL_SCHEME: tailview-dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: DevAssets.xcassets
    preBuildScripts:
      - name: Validate build identity
        script: /bin/sh "${SRCROOT}/scripts/validate-ios-identity.sh"
        inputFiles:
          - $(SRCROOT)/scripts/validate-ios-identity.sh
        basedOnDependencyAnalysis: false
  TailViewLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [LiveActivity, LiveControls, WidgetSupport]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.ios.LiveActivity
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 63
        APP_DISPLAY_NAME: TailView Controls
        INFOPLIST_FILE: LiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.ios.dev.LiveActivity
          APP_DISPLAY_NAME: TailView Controls Dev
    preBuildScripts:
      - name: Validate build identity
        script: /bin/sh "${SRCROOT}/scripts/validate-ios-identity.sh"
        inputFiles:
          - $(SRCROOT)/scripts/validate-ios-identity.sh
        basedOnDependencyAnalysis: false
  TailViewPurchaseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PurchaseTests
      - path: TailView.storekit
        buildPhase: resources
    dependencies:
      - target: TailViewIOS
      - sdk: Developer/Library/Frameworks/StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.purchases.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  TailViewIOS:
    build:
      targets:
        TailViewIOS: all
    run:
      config: Debug
    archive:
      config: Release
  TailViewPurchases:
    build:
      targets:
        TailViewIOS: [run, test]
        TailViewPurchaseTests: [test]
    run:
      config: Debug
      storeKitConfiguration: TailView.storekit
      commandLineArguments:
        "-tailview-test-purchases": true
    test:
      config: Debug
      # Inherit the Run action's local StoreKit setup and purchase-test argument.
      # An independent test argument block makes Xcode disable this inheritance.
      targets:
        - name: TailViewPurchaseTests
          parallelizable: false
    profile:
      config: Release
      commandLineArguments:
        "-tailview-test-purchases": false
