name: TailView
options:
  bundleIdPrefix: com.10x
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: 98CDQPW36W
targets:
  TailViewMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [MacHost, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.mac
        INFOPLIST_FILE: MacHost/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
  TailViewIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [IOSViewer, Shared, LiveControls]
    dependencies:
      - target: TailViewLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.ios
        INFOPLIST_FILE: IOSViewer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  TailViewLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [LiveActivity, LiveControls]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.tailview.ios.LiveActivity
        INFOPLIST_FILE: LiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
