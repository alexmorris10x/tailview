<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>TailView — a pointer reaching into a violet screen</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#24233F"/><stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#E5E9F5"/><stop offset="1" stop-color="#8590B1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.85" y2="1">
      <stop stop-color="#C0A8FF"/><stop offset="0.48" stop-color="#8A65EF"/><stop offset="1" stop-color="#4932A6"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8DEFF" stop-opacity="0.7"/><stop offset="1" stop-color="#D5C0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pointer" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#F5F7FF"/><stop offset="1" stop-color="#CBD5EC"/>
    </linearGradient>
    <filter id="screenShadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="-12" dy="32" stdDeviation="28" flood-color="#030611" flood-opacity="0.6"/>
    </filter>
    <filter id="pointerShadow" x="-60%" y="-50%" width="220%" height="220%">
      <feDropShadow dx="12" dy="22" stdDeviation="18" flood-color="#14102F" flood-opacity="0.5"/>
    </filter>
    <clipPath id="screenClip"><rect x="324" y="164" width="900" height="554" rx="32"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#ink)"/>
  <!-- The screen continues beyond the icon, like a window into the Mac. -->
  <g filter="url(#screenShadow)">
    <rect x="278" y="118" width="992" height="654" rx="76" fill="url(#edge)"/>
    <rect x="284" y="124" width="980" height="642" rx="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="324" y="164" width="900" height="554" rx="32" fill="url(#screen)"/>
    <g clip-path="url(#screenClip)">
      <path d="M324 164H1224V258C994 256 784 344 678 516C584 667 478 711 324 718Z" fill="url(#light)"/>
      <path d="M324 704C528 642 584 590 708 426C820 278 1010 258 1224 268V718H324Z" fill="#392083" opacity="0.15"/>
    </g>
  </g>
  <!-- One substantial, recognizable pointer overlaps the screen's edge. -->
  <g transform="translate(26 24) scale(0.9)">
  <path d="M238 322Q230 300 252 312L630 570Q650 584 626 590L487 621L565 783Q572 799 556 806L493 835Q478 841 471 826L397 669L298 773Q281 791 278 766Z"
        fill="#75809E" transform="translate(0 9)"/>
  <path d="M238 322Q230 300 252 312L630 570Q650 584 626 590L487 621L565 783Q572 799 556 806L493 835Q478 841 471 826L397 669L298 773Q281 791 278 766Z"
        fill="url(#pointer)" filter="url(#pointerShadow)"/>
  <path d="M252 330L609 577L475 607" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
